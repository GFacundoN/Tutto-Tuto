# Publica el curso en GitHub Pages en cada push a main.
# Antes de publicar: valida el contenido y corre los tests (si algo falla, no se publica).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: motor/package-lock.json
      - run: npm ci
      - run: npm run validar-contenido
      - run: npx ng test --watch=false
      - run: npm run build -- --base-href /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: motor/dist/motor/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
