<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="foco1" cx="80%" cy="15%" r="65%">
      <stop offset="0" stop-color="#1d63ed" stop-opacity=".65"/>
      <stop offset="1" stop-color="#1d63ed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="foco2" cx="5%" cy="75%" r="60%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caja" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4c8dff"/><stop offset="1" stop-color="#1d4fd8"/>
    </linearGradient>
    <linearGradient id="caja2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/><stop offset="1" stop-color="#1d63ed"/>
    </linearGradient>
    <pattern id="grilla" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="desvanecer" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".35" stop-color="#05060f" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060f" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="#060a1a"/>
  <rect width="600" height="750" fill="url(#foco2)"/>
  <rect width="600" height="750" fill="url(#foco1)"/>
  <rect width="600" height="750" fill="url(#grilla)"/>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" fill="#fff" fill-opacity=".16">
    <text x="36" y="70">services:</text>
    <text x="56" y="94">api:</text>
    <text x="76" y="118">build: ./api</text>
    <text x="76" y="142">ports: ["8080:8080"]</text>
    <text x="56" y="166">db:</text>
    <text x="76" y="190">image: mysql:8.4</text>
    <text x="300" y="640">$ docker compose up -d</text>
    <text x="300" y="664">✔ Container db   Healthy</text>
  </g>
  <!-- Pila de contenedores -->
  <g transform="translate(150 250)">
    <g opacity=".95">
      <rect x="0" y="130" width="140" height="110" rx="14" fill="url(#caja)"/>
      <rect x="160" y="130" width="140" height="110" rx="14" fill="url(#caja)"/>
      <rect x="80" y="0" width="140" height="110" rx="14" fill="url(#caja2)"/>
    </g>
    <g stroke="#fff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round">
      <path d="M30 155v60M60 155v60M90 155v60M120 155v60M190 155v60M220 155v60M250 155v60M280 155v60M110 25v60M140 25v60M170 25v60M200 25v60"/>
    </g>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".08">
    <circle cx="300" cy="370" r="190"/>
    <circle cx="300" cy="370" r="250"/>
