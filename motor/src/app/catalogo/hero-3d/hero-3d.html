@if (estado() === 'sin-webgl') {
  <!-- Sin WebGL queda la ilustración en SVG (ng-content: la pone el padre). -->
  <ng-content />
} @else {
  <!-- Mientras el puntero o el foco estén acá, el carrusel no avanza solo. -->
  <div
    class="carrusel"
    (pointerenter)="usar(true)"
    (pointerleave)="usar(false)"
    (focusin)="usar(true)"
    (focusout)="usar(false)"
  >
    <div class="marco" [class.lista]="estado() === 'lista'">
      <canvas #lienzo aria-hidden="true"></canvas>
    </div>

    @if (actual(); as c) {
      <div class="controles">
        <button type="button" class="flecha" (click)="mover(-1)" aria-label="Curso anterior">
          <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
            <path d="M10 3.5 5.5 8l4.5 4.5" />
          </svg>
        </button>
        <!-- aria-live: anuncia el curso nuevo solo cuando lo cambió la persona (no en cada avance automático). -->
        <div class="actual" [attr.aria-live]="cambioManual() ? 'polite' : 'off'">
          <strong>{{ c.resumen.titulo }}</strong>
          <span>{{ c.disponible ? c.lecciones + ' lecciones' : 'Próximamente' }}</span>
        </div>
        <button type="button" class="flecha" (click)="mover(1)" aria-label="Curso siguiente">
          <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
            <path d="M6 3.5 10.5 8 6 12.5" />
          </svg>
        </button>
        <div class="pie">
          @if (c.disponible) {
            <a class="entrar" [routerLink]="['/', c.resumen.id]">Entrar al curso</a>
          }
          <button type="button" class="pausa" (click)="alternarReproduccion()">
            {{ reproduciendo() ? 'Pausar' : 'Reproducir' }}
          </button>
        </div>
      </div>
    }
  </div>
}
