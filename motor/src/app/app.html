<!--
  (click): event binding. Llama al método cuando ocurre el evento.
  Es un botón y no un <a href="#…"> porque con el router en modo hash, un enlace a #id cambiaría de ruta.
-->
<button type="button" class="saltar boton boton-principal" (click)="saltarAlContenido()">Saltar al contenido</button>

<header class="barra no-imprimir">
  <div class="barra-interior">
    <!-- routerLink: navega sin recargar la página (como <Link> en React Router). -->
    <a class="marca" routerLink="/" aria-label="Tutto-Tuto, ver todos los cursos">
      <span class="marca-logo" aria-hidden="true">tt</span>
      <span class="marca-texto">Tutto-Tuto</span>
    </a>

    <!--
      @if: control flow de Angular 17+. Muestra el bloque solo si la condición es verdadera.
      "as curso" guarda el resultado en una variable local para usarla adentro.
      (En código viejo vas a ver *ngIf="curso() as curso", que hace lo mismo.)
    -->
    @if (curso(); as curso) {
      <!-- [propiedad]="expresión": property binding. Evalúa TypeScript y lo asigna (acá, un array de ruta). -->
      <span class="separador" aria-hidden="true"></span>
      <a class="curso" [routerLink]="['/', curso.id]">{{ curso.titulo }}</a>
      <dl class="stats" aria-label="Tu progreso">
        <div>
          <dt>Racha</dt>
          <!-- {{ }}: interpolación. Muestra el valor como texto (escapado, sin riesgo de XSS). -->
          <!-- [class.activa]: agrega o saca la clase según el booleano. -->
          <dd [class.activa]="progreso.practicoHoy()">
            {{ progreso.racha() }} {{ progreso.racha() === 1 ? 'día' : 'días' }}
          </dd>
        </div>
        <div>
          <dt>XP</dt>
          <dd>{{ progreso.xp() }}</dd>
        </div>
      </dl>
    }

    <app-selector-tema />
  </div>
</header>

<main id="contenido-principal" tabindex="-1">
  <!-- router-outlet: acá se dibuja el componente de la ruta actual. -->
  <router-outlet />
</main>
