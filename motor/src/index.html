<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <title>Tutto-Tuto</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Cursos interactivos cortos, con práctica en cada paso.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Aplica el tema guardado antes de pintar, para evitar un parpadeo claro→oscuro.
    try {
      var t = localStorage.getItem('tutto-tuto:tema');
      if (t === '"claro"') document.documentElement.dataset.theme = 'light';
      if (t === '"oscuro"') document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
